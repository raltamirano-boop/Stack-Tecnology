<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODM - StackX Architecture Data Flow</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333333; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Intro Overlay */
        #intro-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 50;
            background-color: #ffffff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: opacity 1s ease;
        }
        #intro-overlay h1 {
            font-size: 5rem; margin: 0; color: #006cb5;
            background: linear-gradient(90deg, #006cb5, #5cb5e5); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        #intro-overlay h2 {
            font-size: 2.5rem; margin: 10px 0 40px; color: #333333; font-weight: 300; letter-spacing: 5px;
        }
        .click-to-start {
            font-size: 1.2rem; color: #e31837; animation: pulse 2s infinite; font-weight: bold;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        
        /* UI Top Left */
        #ui-panel {
            position: absolute; top: 30px; left: 30px; z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            border-left: 4px solid #006cb5;
            padding: 20px;
            border-radius: 0 10px 10px 0;
            backdrop-filter: blur(10px);
            max-width: 350px;
            pointer-events: none; /* Let clicks pass */
        }
        #ui-panel h1 { margin: 0 0 10px 0; font-size: 1.8rem; color: #006cb5; }
        #ui-panel p { margin: 0 0 10px 0; font-size: 0.9rem; color: #555555; line-height: 1.4; }
        
        /* Barra de Tecnologías Superior */
        #tech-bar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20;
            display: flex; gap: 10px; background: rgba(255,255,255,0.9);
            padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            pointer-events: auto; opacity: 0; transition: opacity 1s ease;
        }
        .tech-btn {
            background: #f0f0f0; border: none; padding: 8px 16px; border-radius: 20px;
            font-weight: bold; color: #555; cursor: pointer; transition: all 0.2s;
        }
        .tech-btn:hover { background: #e0e0e0; transform: scale(1.05); }
        .tech-btn.active { color: white; background: #006cb5; }
        
        /* Mascot Overlay */
        #mascot-container {
            position: absolute; bottom: 50px; right: 80px; z-index: 15;
            opacity: 0; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #mascot-container img {
            width: 200px; height: 200px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4));
        }
        
        .btn {
            background: #e31837; color: white; border: none; padding: 10px 15px;
            border-radius: 5px; font-weight: bold; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 0 15px rgba(227, 24, 55, 0.4);
            width: 100%; pointer-events: auto;
        }
        .btn:hover { background: #ff3355; transform: scale(1.05); }

        .node-label {
            position: absolute; z-index: 5;
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(0,0,0,0.1);
            color: #333333;
            padding: 5px 12px; border-radius: 6px;
            font-size: 0.85rem; font-weight: bold;
            pointer-events: none; transform: translate(-50%, -50%);
            white-space: nowrap; transition: opacity 0.3s, border-color 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .orbital-label {
            position: absolute; z-index: 4;
            background: rgba(255,255,255,0.95);
            color: #333;
            border-left: 3px solid #333;
            padding: 4px 8px; border-radius: 4px;
            font-size: 0.75rem; font-family: monospace;
            pointer-events: none; transform: translate(-50%, -50%);
            white-space: nowrap; opacity: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        
        #labels-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; pointer-events: none; }
    </style>
    
    <!-- Three.js CDN and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- GSAP for smooth transitions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="intro-overlay">
        <h1>ÓMNIBUS DE MÉXICO</h1>
        <h2>STACKX ARCHITECTURE</h2>
        <div class="click-to-start">Haz clic para descubrir la nueva arquitectura</div>
    </div>

    <!-- Barra de Tecnologías -->
    <div id="tech-bar">
        <button class="tech-btn" data-target="auth" data-color="#3178C6" data-icon="https://cdn.simpleicons.org/typescript/ffffff">NestJS</button>
        <button class="tech-btn" data-target="catalog" data-color="#3776AB" data-icon="https://cdn.simpleicons.org/python/ffffff">FastAPI</button>
        <button class="tech-btn" data-target="orders" data-color="#ED8B00" data-icon="https://cdn.simpleicons.org/java/ffffff">Spring Boot</button>
        <button class="tech-btn" data-target="events" data-color="#00ADD8" data-icon="https://cdn.simpleicons.org/go/ffffff">Go</button>
        <button class="tech-btn" data-target="dotnet" data-color="#512BD4" data-icon="https://cdn.simpleicons.org/csharp/ffffff">.NET</button>
    </div>

    <!-- Mascota / Logo Overlay -->
    <div id="mascot-container">
        <img id="mascot-img" src="" alt="Tech Mascot">
    </div>

    <div id="ui-panel" style="opacity: 0;">
        <h1>StackX Architecture</h1>
        <p>Demostración interactiva del enrutamiento de microservicios. Pasa el cursor sobre un nodo o tubería para revelar su stack tecnológico.</p>
        <button id="traffic-btn" class="btn">Simular Pico de Tráfico (Catálogo)</button>
    </div>

    <div id="labels-container" style="opacity: 0;"></div>
    <div id="canvas-container"></div>

    <script>
        // --- 1. CONFIGURACIÓN BASE ---
        const NEUTRAL_COLOR = '#d1d5db';
        const DIM_OPACITY = 0.2;
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2('#ffffff', 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 50;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- 2. DATOS DE LOS ECOSISTEMAS (STACKX) ---
        const ecosystems = {
            'origin': { 
                name: 'App Móvil ODM', brand: '#006cb5', pos: [-12, 0, 0], 
                orbitals: [
                    { shape: 'diamond', text: 'App Nativa (iOS/Android)' }, 
                    { shape: 'sphere', text: 'UI / UX' }
                ] 
            },
            'auth': { 
                name: 'auth-app-odm', brand: '#006cb5', pos: [10, 8, -6], 
                orbitals: [
                    { shape: 'shield', text: 'SSO Apple/Google' }, 
                    { shape: 'box', text: 'Perfiles y Pasajeros' }
                ] 
            },
            'catalog': { 
                name: 'journey-odm', brand: '#006cb5', pos: [14, 0, 0], 
                orbitals: [
                    { shape: 'diamond', text: 'Itinerarios y Asientos' }, 
                    { shape: 'sphere', text: 'Promociones' },
                    { shape: 'box', text: 'Búsqueda Origen/Destino' }
                ] 
            },
            'orders': { 
                name: 'payments-odm', brand: '#006cb5', pos: [10, -8, 6], 
                orbitals: [
                    { shape: 'shield', text: 'Motor Banamex / Unlimit' }, 
                    { shape: 'box', text: 'Intercambios y Reservas' }
                ] 
            },
            'events': { 
                name: 'notification-odm', brand: '#006cb5', pos: [2, -10, -8], 
                orbitals: [
                    { shape: 'diamond', text: 'Generación PDFs' }, 
                    { shape: 'sphere', text: 'Apple / Google Wallet' }
                ] 
            }
        };

        const nodesMap = {}; 
        const labelsContainer = document.getElementById('labels-container');

        // Geometrías reusables
        const coreGeo = new THREE.BoxGeometry(1.8, 1.8, 1.8);
        const shieldGeo = new THREE.ConeGeometry(0.5, 1, 4); shieldGeo.rotateX(Math.PI/2);
        const cylGeo = new THREE.CylinderGeometry(0.4, 0.4, 1, 16);
        const sphereGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const diamondGeo = new THREE.OctahedronGeometry(0.5, 0);

        // --- 3. CREACIÓN DE NODOS Y ANILLOS ORBITALES ---
        function createEcosystem(id, data) {
            const group = new THREE.Group();
            group.position.set(...data.pos);
            group.scale.set(0.01, 0.01, 0.01); // Oculto inicialmente
            scene.add(group);

            // Core Mesh
            const coreMat = new THREE.MeshStandardMaterial({ 
                color: NEUTRAL_COLOR, emissive: NEUTRAL_COLOR, emissiveIntensity: 0.8,
                transparent: true, opacity: 0.9, roughness: 0.2
            });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            
            // Edges (Bordes)
            const edges = new THREE.EdgesGeometry(coreGeo);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.3 });
            const edgesMesh = new THREE.LineSegments(edges, lineMat);
            coreMesh.add(edgesMesh);
            
            group.add(coreMesh);
            coreMesh.userData = { isNode: true, id: id };

            // Etiqueta Principal (HTML)
            const mainLabel = document.createElement('div');
            mainLabel.className = 'node-label';
            mainLabel.innerText = data.name;
            mainLabel.style.color = data.brand;
            labelsContainer.appendChild(mainLabel);

            // Anillo Orbital (Oculto por defecto)
            const orbitalGroup = new THREE.Group();
            orbitalGroup.scale.set(0.01, 0.01, 0.01); // Escala 0 para ocultar
            group.add(orbitalGroup);

            const orbitalDataList = [];

            // Elementos Orbitando
            data.orbitals.forEach((orbData, index) => {
                let geo;
                if (orbData.shape === 'shield') geo = shieldGeo;
                else if (orbData.shape === 'cylinder') geo = cylGeo;
                else if (orbData.shape === 'sphere') geo = sphereGeo;
                else geo = diamondGeo;

                const orbMat = new THREE.MeshStandardMaterial({ 
                    color: data.brand, emissive: data.brand, emissiveIntensity: 0.6, wireframe: orbData.shape === 'diamond'
                });
                const orbMesh = new THREE.Mesh(geo, orbMat);
                
                // Distribuir en círculo
                const angle = (index / data.orbitals.length) * Math.PI * 2;
                const radius = 3.5;
                orbMesh.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);
                orbitalGroup.add(orbMesh);

                // Etiqueta Técnica HTML
                const techLabel = document.createElement('div');
                techLabel.className = 'orbital-label';
                techLabel.innerText = orbData.text;
                techLabel.style.borderLeftColor = data.brand;
                labelsContainer.appendChild(techLabel);

                orbitalDataList.push({ mesh: orbMesh, label: techLabel, angle: angle, radius: radius });
            });

            nodesMap[id] = { 
                id, group, coreMesh, lineMat, orbitalGroup, orbitalDataList, mainLabel, data 
            };
        }

        // Crear todos los ecosistemas
        Object.entries(ecosystems).forEach(([id, data]) => createEcosystem(id, data));

        // --- 3.5 CREACIÓN DE BASES DE DATOS STANDALONE ---
        const databases = [
            { id: 'pg', name: 'PostgreSQL', brand: '#006cb5', pos: [12, 13, -10], parent: 'auth' },
            { id: 'db2', name: 'DB2', brand: '#006cb5', pos: [12, -13, 10], parent: 'orders' }
        ];
        
        const dbsMap = {};

        function createDatabase(data) {
            const geo = new THREE.CylinderGeometry(1, 1, 1.5, 16);
            const mat = new THREE.MeshStandardMaterial({ 
                color: NEUTRAL_COLOR, emissive: NEUTRAL_COLOR, emissiveIntensity: 0.8,
                transparent: true, opacity: 0.9, roughness: 0.2
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(...data.pos);
            mesh.scale.set(0.01, 0.01, 0.01); // Oculto inicialmente
            scene.add(mesh);

            // Borde
            const edges = new THREE.EdgesGeometry(geo);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.3 });
            mesh.add(new THREE.LineSegments(edges, lineMat));

            // Línea de Conexión
            const parentPos = nodesMap[data.parent].group.position;
            const points = [parentPos, new THREE.Vector3(...data.pos)];
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const connMat = new THREE.LineBasicMaterial({ color: 0x666666, transparent: true, opacity: 0 });
            const line = new THREE.Line(lineGeo, connMat);
            scene.add(line);

            // Etiqueta
            const label = document.createElement('div');
            label.className = 'node-label';
            label.innerText = data.name;
            label.style.color = data.brand;
            labelsContainer.appendChild(label);

            dbsMap[data.id] = { mesh, line, label, data };
        }
        databases.forEach(db => createDatabase(db));

        // --- 4. TUBERÍAS Y FLUJO DE DATOS ---
        const pathsMap = {};
        const MAX_PARTICLES = 400;
        const particleGeo = new THREE.SphereGeometry(0.12, 8, 8);

        function createDataPath(destId) {
            const start = nodesMap['origin'].group.position;
            const end = nodesMap[destId].group.position;
            
            const midPoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
            midPoint.y += (Math.random() - 0.5) * 8; 
            midPoint.z += (Math.random() - 0.5) * 8; 

            const curve = new THREE.CatmullRomCurve3([start, midPoint, end]);
            
            // Tubo Estático
            const tubeGeo = new THREE.TubeGeometry(curve, 64, 0.1, 8, false);
            const tubeMat = new THREE.MeshStandardMaterial({ 
                color: 0x666666, transparent: true, opacity: 0, wireframe: true 
            });
            const tube = new THREE.Mesh(tubeGeo, tubeMat);
            scene.add(tube);
            tube.userData = { isTube: true, id: destId };

            // Partículas (InstancedMesh) - Inician neutras
            const pMat = new THREE.MeshBasicMaterial({ color: NEUTRAL_COLOR, transparent: true, opacity: 0.6 });
            const instancedMesh = new THREE.InstancedMesh(particleGeo, pMat, MAX_PARTICLES);
            instancedMesh.count = 40; // Default count
            
            const instances = [];
            for (let i = 0; i < MAX_PARTICLES; i++) {
                instances.push({ progress: Math.random(), speed: 0.001 + Math.random() * 0.002, active: i < 40 });
            }
            scene.add(instancedMesh);

            pathsMap[destId] = { curve, tube, instancedMesh, instances, pMat, defaultSpeed: 0.0015 };
        }

        createDataPath('auth');
        createDataPath('catalog');
        createDataPath('orders');
        createDataPath('events');

        // --- 5. ANIMACIÓN DE ENTRADA (INTRODUCCIÓN) ---
        let sceneActive = false;
        document.getElementById('intro-overlay').addEventListener('click', () => {
            if(sceneActive) return;
            sceneActive = true;
            
            // Fade out intro
            gsap.to('#intro-overlay', { 
                opacity: 0, duration: 0.8, 
                onComplete: () => document.getElementById('intro-overlay').style.display = 'none' 
            });
            
            // Fade in UI y Barra Tech
            gsap.to('#ui-panel', { opacity: 1, duration: 1, delay: 0.5 });
            gsap.to('#tech-bar', { opacity: 1, duration: 1, delay: 0.5 });
            gsap.to('#labels-container', { opacity: 1, duration: 1, delay: 1 });

            // Animar cámara desde lejos
            camera.position.set(0, 0, 80);
            gsap.to(camera.position, { z: 25, duration: 2.5, ease: "power3.out" });

            // Pop-in Nodos
            let delay = 0.5;
            Object.values(nodesMap).forEach((node) => {
                gsap.to(node.group.scale, { x: 1, y: 1, z: 1, duration: 1.5, delay: delay, ease: "elastic.out(1, 0.5)" });
                delay += 0.2;
            });

            // Fade in Tubos y Líneas de DB
            Object.values(pathsMap).forEach((path) => {
                gsap.to(path.tube.material, { opacity: DIM_OPACITY, duration: 2, delay: 1.5 });
            });
            Object.values(dbsMap).forEach(db => {
                gsap.to(db.mesh.scale, { x: 1, y: 1, z: 1, duration: 1.5, delay: 1.2, ease: "elastic.out(1, 0.5)" });
                gsap.to(db.line.material, { opacity: DIM_OPACITY, duration: 2, delay: 1.5 });
            });
        });

        // --- 6. INTERACTIVIDAD (HOVER & RAYCASTER) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredId = null;

        function updateSceneState(activeId) {
            const isNeutral = activeId === null;
            
            // Origen se enciende si cualquier cosa está activa
            const originNode = nodesMap['origin'];
            gsap.to(originNode.coreMesh.material.color, { 
                r: new THREE.Color(isNeutral ? NEUTRAL_COLOR : originNode.data.brand).r,
                g: new THREE.Color(isNeutral ? NEUTRAL_COLOR : originNode.data.brand).g,
                b: new THREE.Color(isNeutral ? NEUTRAL_COLOR : originNode.data.brand).b,
                duration: 0.4 
            });
            gsap.to(originNode.coreMesh.material, { emissiveIntensity: isNeutral ? 0.8 : 1.5, opacity: 1, duration: 0.4 });
            if(isNeutral) {
                gsap.to(originNode.orbitalGroup.scale, { x: 0.01, y: 0.01, z: 0.01, duration: 0.4 });
                originNode.orbitalDataList.forEach(orb => orb.label.style.opacity = '0');
            } else if (activeId === 'origin') {
                gsap.to(originNode.orbitalGroup.scale, { x: 1, y: 1, z: 1, duration: 0.6, ease: "back.out(1.5)" });
                originNode.orbitalDataList.forEach(orb => orb.label.style.opacity = '1');
            }

            // Destinos y Rutas
            Object.keys(pathsMap).forEach(destId => {
                const node = nodesMap[destId];
                const path = pathsMap[destId];
                const isActive = activeId === destId || activeId === 'origin';
                
                const targetColor = isActive ? node.data.brand : NEUTRAL_COLOR;
                const targetOpacity = isNeutral ? 0.9 : (isActive ? 1.0 : DIM_OPACITY);
                const tubeOpacity = isNeutral ? 0.05 : (isActive ? 0.3 : 0.02);
                
                // Color y Opacidad del Nodo
                gsap.to(node.coreMesh.material.color, { 
                    r: new THREE.Color(targetColor).r, g: new THREE.Color(targetColor).g, b: new THREE.Color(targetColor).b, duration: 0.4 
                });
                gsap.to(node.coreMesh.material, { 
                    emissiveIntensity: isActive ? 1.5 : 0.8, opacity: targetOpacity, duration: 0.4 
                });
                gsap.to(node.lineMat, { opacity: isNeutral ? 0.2 : (isActive ? 0.8 : 0.05), duration: 0.4 });
                
                // Orbitales del Nodo
                if (activeId === destId) {
                    gsap.to(node.orbitalGroup.scale, { x: 1, y: 1, z: 1, duration: 0.6, ease: "back.out(1.5)" });
                    node.orbitalDataList.forEach(orb => orb.label.style.opacity = '1');
                } else {
                    gsap.to(node.orbitalGroup.scale, { x: 0.01, y: 0.01, z: 0.01, duration: 0.4 });
                    node.orbitalDataList.forEach(orb => orb.label.style.opacity = '0');
                }
                node.mainLabel.style.opacity = targetOpacity;

                // Color y Opacidad de las Partículas/Tubos
                gsap.to(path.tube.material, { opacity: tubeOpacity, duration: 0.4 });
                gsap.to(path.pMat.color, { 
                    r: new THREE.Color(targetColor).r, g: new THREE.Color(targetColor).g, b: new THREE.Color(targetColor).b, duration: 0.4 
                });
                gsap.to(path.pMat, { opacity: isActive ? 1 : 0.3, duration: 0.4 });

                // Acelerar partículas
                path.instances.forEach(inst => {
                    inst.speed = isActive ? (0.005 + Math.random()*0.004) : (path.defaultSpeed + Math.random()*0.001);
                });
            });

            // Actualizar Bases de Datos
            Object.values(dbsMap).forEach(db => {
                const isActive = activeId === db.data.parent || activeId === 'origin';
                const targetColor = isActive ? db.data.brand : NEUTRAL_COLOR;
                const targetOpacity = isNeutral ? 0.9 : (isActive ? 1.0 : DIM_OPACITY);
                
                gsap.to(db.mesh.material.color, { r: new THREE.Color(targetColor).r, g: new THREE.Color(targetColor).g, b: new THREE.Color(targetColor).b, duration: 0.4 });
                gsap.to(db.mesh.material, { emissiveIntensity: isActive ? 1.5 : 0.8, opacity: targetOpacity, duration: 0.4 });
                gsap.to(db.line.material, { opacity: isNeutral ? 0.2 : (isActive ? 0.8 : 0.05), duration: 0.4 });
                db.label.style.opacity = targetOpacity;
            });
        }

        window.addEventListener('mousemove', (event) => {
            if (!sceneActive) return; // No permitir interacción hasta que inicie
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            const interactables = [];
            Object.values(nodesMap).forEach(n => interactables.push(n.coreMesh));
            Object.values(pathsMap).forEach(p => interactables.push(p.tube));

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactables);

            if (intersects.length > 0) {
                document.body.style.cursor = 'pointer';
                const id = intersects[0].object.userData.id;
                
                if (hoveredId !== id) {
                    hoveredId = id;
                    updateSceneState(hoveredId);
                }
            } else {
                document.body.style.cursor = 'default';
                if (hoveredId !== null) {
                    hoveredId = null;
                    updateSceneState(null);
                }
            }
        });

        // Eventos de la Barra de Tecnologías
        let forcedId = null;
        let bgTween = null;
        const defaultBg = new THREE.Color(0xffffff);
        const currentBg = new THREE.Color(0xffffff);

        document.querySelectorAll('.tech-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const target = e.target.getAttribute('data-target');
                const colorStr = e.target.getAttribute('data-color');
                const iconSrc = e.target.getAttribute('data-icon');
                
                // Resetear todos los botones
                document.querySelectorAll('.tech-btn').forEach(b => {
                    b.classList.remove('active');
                    b.style.background = '#f0f0f0';
                });

                if (forcedId === target) {
                    // Desactivar: Regresar a fondo blanco y ocultar mascota
                    forcedId = null;
                    if(bgTween) bgTween.kill();
                    bgTween = gsap.to(currentBg, {
                        r: defaultBg.r, g: defaultBg.g, b: defaultBg.b, duration: 1,
                        onUpdate: () => { scene.background = currentBg; scene.fog.color = currentBg; }
                    });
                    
                    gsap.to('#mascot-container', { opacity: 0, scale: 0.5, duration: 0.5, ease: "back.in(1.7)" });
                    
                } else {
                    // Activar: Cambiar fondo y mostrar mascota
                    forcedId = target;
                    e.target.classList.add('active');
                    e.target.style.background = colorStr;
                    
                    const targetBg = new THREE.Color(colorStr);
                    if(bgTween) bgTween.kill();
                    bgTween = gsap.to(currentBg, {
                        r: targetBg.r, g: targetBg.g, b: targetBg.b, duration: 1,
                        onUpdate: () => { scene.background = currentBg; scene.fog.color = currentBg; }
                    });

                    const mascotImg = document.getElementById('mascot-img');
                    mascotImg.src = iconSrc;
                    gsap.fromTo('#mascot-container', 
                        { scale: 0.5, opacity: 0 }, 
                        { scale: 1, opacity: 1, duration: 0.8, ease: "elastic.out(1, 0.5)" }
                    );
                }
            });
        });

        // --- 7. PICO DE TRÁFICO (Simulación) ---
        let isTrafficPeak = false;
        const trafficBtn = document.getElementById('traffic-btn');
        
        trafficBtn.addEventListener('click', () => {
            isTrafficPeak = !isTrafficPeak;
            const path = pathsMap['catalog'];
            
            if (isTrafficPeak) {
                trafficBtn.innerText = "Detener Simulación";
                trafficBtn.style.background = "#ff3355";
                
                path.instancedMesh.count = MAX_PARTICLES;
                path.instances.forEach(inst => {
                    inst.active = true;
                    inst.speed = 0.01 + Math.random() * 0.01;
                });
                // Alert on node
                gsap.to(nodesMap['catalog'].coreMesh.scale, { x: 1.3, y: 1.3, z: 1.3, duration: 0.2, yoyo: true, repeat: -1 });
            } else {
                trafficBtn.innerText = "Simular Pico de Tráfico (Catálogo)";
                trafficBtn.style.background = "#e31837";
                
                path.instancedMesh.count = 40;
                path.instances.forEach((inst, idx) => {
                    inst.active = idx < 40;
                    inst.speed = path.defaultSpeed + Math.random()*0.001;
                });
                gsap.killTweensOf(nodesMap['catalog'].coreMesh.scale);
                gsap.to(nodesMap['catalog'].coreMesh.scale, { x: 1, y: 1, z: 1, duration: 0.5 });
            }
        });

        // --- 8. BUCLE DE RENDERIZADO ---
        const dummy = new THREE.Object3D();
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            const time = clock.getElapsedTime();

            // Rotación Base Nodes
            Object.values(nodesMap).forEach(node => {
                node.coreMesh.rotation.x = Math.sin(time * 0.5) * 0.2;
                node.coreMesh.rotation.y += 0.005;
                
                // Rotación de Grupos Orbitales
                node.orbitalGroup.rotation.y = time * -0.5;
                node.orbitalGroup.rotation.z = Math.sin(time * 0.2) * 0.2;

                // Actualizar proyección 2D de Main Label
                const pos = new THREE.Vector3();
                node.coreMesh.getWorldPosition(pos);
                pos.y += 2.5;
                pos.project(camera);
                const x = (pos.x * .5 + .5) * window.innerWidth;
                const y = (pos.y * -.5 + .5) * window.innerHeight;
                node.mainLabel.style.left = `${x}px`;
                node.mainLabel.style.top = `${y}px`;
                node.mainLabel.style.display = pos.z > 1 ? 'none' : 'block';

                // Actualizar proyección 2D de Orbital Labels
                node.orbitalDataList.forEach(orb => {
                    const orbPos = new THREE.Vector3();
                    orb.mesh.getWorldPosition(orbPos);
                    orbPos.y += 1;
                    orbPos.project(camera);
                    const ox = (orbPos.x * .5 + .5) * window.innerWidth;
                    const oy = (orbPos.y * -.5 + .5) * window.innerHeight;
                    orb.label.style.left = `${ox}px`;
                    orb.label.style.top = `${oy}px`;
                    
                    // Rotar meshes internos para que luzcan dinámicos
                    orb.mesh.rotation.x += 0.02;
                    orb.mesh.rotation.y += 0.02;
                });
            });

            // Animación y Etiquetas de las Bases de Datos
            Object.values(dbsMap).forEach(db => {
                db.mesh.rotation.y += 0.01;
                
                const dbPos = new THREE.Vector3();
                db.mesh.getWorldPosition(dbPos);
                dbPos.y += 1.8;
                dbPos.project(camera);
                const dbX = (dbPos.x * .5 + .5) * window.innerWidth;
                const dbY = (dbPos.y * -.5 + .5) * window.innerHeight;
                db.label.style.left = `${dbX}px`;
                db.label.style.top = `${dbY}px`;
                db.label.style.display = dbPos.z > 1 ? 'none' : 'block';
            });

            // Flujo de Partículas
            Object.values(pathsMap).forEach(path => {
                const mesh = path.instancedMesh;
                const instances = path.instances;
                const curve = path.curve;

                for (let i = 0; i < mesh.count; i++) {
                    const inst = instances[i];
                    if (!inst.active) continue;

                    inst.progress += inst.speed;
                    if (inst.progress > 1) inst.progress = 0;

                    const point = curve.getPointAt(inst.progress);
                    
                    // Jitter para esparcirlas por el tubo
                    const radius = 0.25;
                    const jitterX = Math.sin(inst.progress * 80 + i) * radius;
                    const jitterY = Math.cos(inst.progress * 60 + i) * radius;
                    const jitterZ = Math.sin(inst.progress * 70 + i) * radius;

                    dummy.position.set(point.x + jitterX, point.y + jitterY, point.z + jitterZ);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(i, dummy.matrix);
                }
                mesh.instanceMatrix.needsUpdate = true;
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
